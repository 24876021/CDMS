server:
 port: 8082
 # address: 192.168.93.11 # 前端在局域网内其它的设备上运行时启用

# 建库配置（自定义节点，供DatabaseInitializer使用）
database:
 init:
  # 数据库名称（MySQL/SQLite共用）
  name: community_diagnosis_db
  # MySQL临时连接URL（仅用于创建数据库）
  temp-url: jdbc:mysql://localhost:3306/?serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
  # MySQL建库账户（需有建库权限）
  username: root
  password: /*你的数据库密码*/
  # SQLite专属配置
  sqlite:
   # SQLite数据库文件路径（指定存放目录）
   path: ./data/${database.init.name}.db
   # SQLite初始化脚本路径
   schema-location: classpath:sql/schema-tables-sqlite.sql
  # 新增：预解析后的SQLite完整路径（供Spring直接使用）
  sqlite-full-url: jdbc:sqlite:./data/${database.init.name}.db

# Spring核心配置
spring:
 # 数据源配置（仅作为配置项，实际由DynamicDataSourceConfig动态配置）
 datasource:
  # MySQL主数据源配置
  username: root
  password: /*你的数据库密码*/
  url: jdbc:mysql://localhost:3306/${database.init.name}?serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
  driver-class-name: com.mysql.cj.jdbc.Driver
  # SQLite备用数据源配置（降级时使用）
  sqlite:
   # 直接使用预解析的完整URL，避免二次替换
   url: ${database.init.sqlite-full-url}
   driver-class-name: org.sqlite.JDBC

 # Redis配置
 redis:
  host: 127.0.0.1
  port: 6379
  timeout: 5000ms

 # MVC配置
 mvc:
  pathmatch:
   matching-strategy: ant-path-matcher

 # SQL初始化配置
 sql:
  init:
   mode: embedded
   schema-locations: classpath:sql/schema-tables-${spring.sql.init.platform}.sql
   encoding: UTF-8
   separator: ;
   platform: mysql
   continue-on-error: true
   initialize-schema: embedded

# JWT配置
shuangtian:
 jwt:
  header: Authorization
  expire: 604800 # 7天（秒）
  secret: abcdefghabcdefghabcdefghabcdefgh

